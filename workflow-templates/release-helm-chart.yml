# Before committing, replace both charts/REPLACE_ME values with the same chart
# directory. Chart.yaml is the only version source; do not add tag, release, or
# manual-input publication paths.
name: Release Helm Chart

on:
  push:
    branches: [$default-branch]
    paths:
      - 'charts/REPLACE_ME/Chart.yaml'

permissions:
  contents: read

concurrency:
  # Distinct pushed revisions use distinct immutable versions and must not
  # replace one another in GitHub's single-pending concurrency queue.
  group: release-helm-chart-${{ github.sha }}
  cancel-in-progress: false

env:
  CHART_PATH: charts/REPLACE_ME
  OCI_NAMESPACE: charts
  PACKAGE_DIR: chart-release
  HELM_VERSION: v4.2.3
  HELM_DOCS_VERSION: v1.14.2
  HELM_SCHEMA_VERSION: 2.5.0

jobs:
  plan:
    name: Plan chart release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.chart.outputs.changed }}
      name: ${{ steps.chart.outputs.name }}
      version: ${{ steps.chart.outputs.version }}
      tag: ${{ steps.chart.outputs.tag }}
    steps:
      - name: Checkout exact pushed revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Compare Chart.yaml versions
        id: chart
        shell: bash
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          export LC_ALL=C

          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          chart_file="$CHART_PATH/Chart.yaml"
          test -f "$chart_file"

          chart_field() {
            local chart="$1"
            local field="$2"
            helm show chart "$chart" | awk -F': ' -v field="$field" '$1 == field { print $2; exit }'
          }

          current_name="$(chart_field "$CHART_PATH" name)"
          current_version="$(chart_field "$CHART_PATH" version)"
          [[ "$current_name" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$ ]]
          [[ "$current_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]

          previous_name=""
          previous_version=""
          if [[ ! "$BASE_SHA" =~ ^0+$ ]]; then
            if ! git cat-file -e "${BASE_SHA}^{commit}"; then
              echo "The push base commit is unavailable: $BASE_SHA" >&2
              exit 1
            fi

            if git cat-file -e "${BASE_SHA}:${chart_file}" 2>/dev/null; then
              previous_chart="$RUNNER_TEMP/chart-before"
              mkdir -p "$previous_chart"
              git show "${BASE_SHA}:${chart_file}" > "$previous_chart/Chart.yaml"
              previous_name="$(chart_field "$previous_chart" name)"
              previous_version="$(chart_field "$previous_chart" version)"
              [[ "$previous_name" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$ ]]
              [[ "$previous_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            fi
          fi

          changed=false
          if [[ -z "$previous_version" ]]; then
            changed=true
          elif [[ "$current_name" != "$previous_name" ]]; then
            echo "Chart name must not change at a configured release path: $previous_name -> $current_name" >&2
            exit 1
          elif [[ "$current_version" != "$previous_version" ]]; then
            highest_version="$(printf '%s\n%s\n' "$previous_version" "$current_version" | sort -V | tail -n 1)"
            if [[ "$highest_version" != "$current_version" ]]; then
              echo "Chart version must increase: $previous_version -> $current_version" >&2
              exit 1
            fi
            changed=true
          fi

          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "name=$current_name" >> "$GITHUB_OUTPUT"
          echo "version=$current_version" >> "$GITHUB_OUTPUT"
          echo "tag=${current_name}-${current_version}" >> "$GITHUB_OUTPUT"

  package:
    name: Verify and package chart
    needs: plan
    if: needs.plan.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact pushed revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Set up helm-docs
        uses: gabe565/setup-helm-docs-action@v1
        with:
          version: ${{ env.HELM_DOCS_VERSION }}

      # Helm 4 verifies plugins by default, while this plugin does not publish
      # provenance metadata. The version remains explicit and reproducible.
      - name: Install values schema generator
        run: >-
          helm plugin install
          https://github.com/losisin/helm-values-schema-json.git
          --version "v${HELM_SCHEMA_VERSION}"
          --verify=false

      - name: Run local Helm CI contract
        run: make verify-helm-chart

      # Packaging is generic publication orchestration. All repository-specific
      # validation remains in make verify-helm-chart.
      - name: Package chart once
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq '^dependencies:' "$CHART_PATH/Chart.yaml"; then
            git ls-files --error-unmatch "$CHART_PATH/Chart.lock" >/dev/null
          fi

          helm dependency build "$CHART_PATH"

          if [[ -n "$(git status --porcelain --untracked-files=all -- "$CHART_PATH/Chart.lock" "$CHART_PATH/charts")" ]]; then
            echo "helm dependency build changed the committed dependency tree" >&2
            git status --short -- "$CHART_PATH/Chart.lock" "$CHART_PATH/charts" >&2
            exit 1
          fi

          mkdir -p "$PACKAGE_DIR"
          helm package "$CHART_PATH" --destination "$PACKAGE_DIR"

      - name: Validate package identity
        shell: bash
        env:
          EXPECTED_NAME: ${{ needs.plan.outputs.name }}
          EXPECTED_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=("$PACKAGE_DIR"/*.tgz)
          test "${#packages[@]}" = 1
          test -s "${packages[0]}"

          package_name="$(helm show chart "${packages[0]}" | awk -F': ' '$1 == "name" { print $2; exit }')"
          package_version="$(helm show chart "${packages[0]}" | awk -F': ' '$1 == "version" { print $2; exit }')"
          test "$package_name" = "$EXPECTED_NAME"
          test "$package_version" = "$EXPECTED_VERSION"
          test "$(basename "${packages[0]}")" = "${EXPECTED_NAME}-${EXPECTED_VERSION}.tgz"

      - name: Upload chart package
        uses: actions/upload-artifact@v7
        with:
          name: helm-chart-${{ github.sha }}
          path: ${{ env.PACKAGE_DIR }}/*.tgz
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  publish:
    name: Publish chart
    needs:
      - plan
      - package
    if: needs.plan.outputs.changed == 'true' && needs.package.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Download chart package
        uses: actions/download-artifact@v8
        with:
          name: helm-chart-${{ github.sha }}
          path: ${{ env.PACKAGE_DIR }}

      - name: Validate downloaded package
        shell: bash
        env:
          EXPECTED_NAME: ${{ needs.plan.outputs.name }}
          EXPECTED_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          package="$PACKAGE_DIR/${EXPECTED_NAME}-${EXPECTED_VERSION}.tgz"
          test -s "$package"
          test "$(helm show chart "$package" | awk -F': ' '$1 == "name" { print $2; exit }')" = "$EXPECTED_NAME"
          test "$(helm show chart "$package" | awk -F': ' '$1 == "version" { print $2; exit }')" = "$EXPECTED_VERSION"

      - name: Log in to GHCR
        shell: bash
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Require unused release version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          EXPECTED_NAME: ${{ needs.plan.outputs.name }}
          EXPECTED_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail

          require_github_absence() {
            local endpoint="$1"
            local label="$2"
            local response_file="$RUNNER_TEMP/github-response.json"
            local status

            status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/${endpoint}")"

            case "$status" in
              404) ;;
              200)
                echo "$label already exists for $RELEASE_TAG" >&2
                exit 1
                ;;
              *)
                echo "Failed to check $label for $RELEASE_TAG: HTTP $status" >&2
                exit 1
                ;;
            esac
          }

          require_github_absence "git/ref/tags/$RELEASE_TAG" "Git tag"
          require_github_absence "releases/tags/$RELEASE_TAG" "GitHub release"

          chart="oci://ghcr.io/${{ github.repository_owner }}/${OCI_NAMESPACE}/${EXPECTED_NAME}"
          lookup_error="$RUNNER_TEMP/oci-lookup-error"
          if helm show chart "$chart" --version "$EXPECTED_VERSION" >/dev/null 2>"$lookup_error"; then
            echo "OCI chart already exists: $chart:$EXPECTED_VERSION" >&2
            exit 1
          fi

          if ! grep -Eqi 'not found|manifest unknown|name unknown' "$lookup_error"; then
            echo "Failed to check OCI chart: $chart:$EXPECTED_VERSION" >&2
            sed -n '1,20p' "$lookup_error" >&2
            exit 1
          fi

      - name: Publish package to GHCR
        run: helm push "$PACKAGE_DIR"/*.tgz "oci://ghcr.io/${{ github.repository_owner }}/${OCI_NAMESPACE}"

      - name: Verify published OCI chart
        shell: bash
        env:
          EXPECTED_NAME: ${{ needs.plan.outputs.name }}
          EXPECTED_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          chart="oci://ghcr.io/${{ github.repository_owner }}/${OCI_NAMESPACE}/${EXPECTED_NAME}"
          metadata="$(helm show chart "$chart" --version "$EXPECTED_VERSION")"
          test "$(awk -F': ' '$1 == "name" { print $2; exit }' <<< "$metadata")" = "$EXPECTED_NAME"
          test "$(awk -F': ' '$1 == "version" { print $2; exit }' <<< "$metadata")" = "$EXPECTED_VERSION"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          name: ${{ needs.plan.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body: Helm chart ${{ needs.plan.outputs.name }} ${{ needs.plan.outputs.version }}
          make_latest: false
          overwrite_files: false
          fail_on_unmatched_files: true
          files: ${{ env.PACKAGE_DIR }}/*.tgz

  helm-chart-release-required:
    name: Helm Chart Release required
    if: always()
    needs:
      - plan
      - package
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful release decision
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          VERSION_CHANGED: ${{ needs.plan.outputs.changed }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          if [[ "$PLAN_RESULT" != "success" ]]; then
            echo "Chart release planning failed: $PLAN_RESULT"
            exit 1
          fi

          case "$VERSION_CHANGED" in
            false)
              if [[ "$PACKAGE_RESULT" != "skipped" || "$PUBLISH_RESULT" != "skipped" ]]; then
                echo "Unexpected work ran without a chart version change."
                exit 1
              fi
              echo "Chart version did not change."
              exit 0
              ;;
            true)
              if [[ "$PACKAGE_RESULT" != "success" || "$PUBLISH_RESULT" != "success" ]]; then
                echo "Chart release did not complete: package=$PACKAGE_RESULT publish=$PUBLISH_RESULT"
                exit 1
              fi
              ;;
            *)
              echo "Chart release planning returned an invalid decision: $VERSION_CHANGED"
              exit 1
              ;;
          esac
