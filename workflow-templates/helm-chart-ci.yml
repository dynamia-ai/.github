# This template expects a repository-owned, non-mutating Helm verification target.
# After copying, extend the filter for every file that can affect that target.
name: Helm Chart CI

on:
  pull_request:
    branches: [$default-branch]
  push:
    branches: [$default-branch]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: helm-chart-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HELM_VERSION: v4.2.3
  HELM_DOCS_VERSION: v1.14.2
  HELM_SCHEMA_VERSION: 2.5.0

jobs:
  changes:
    name: Detect Helm changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      helm: ${{ github.event_name != 'pull_request' || steps.filter.outputs.helm == 'true' }}
    steps:
      - name: Filter changed files
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            helm:
              - 'charts/**'
              - 'Makefile'
              - '**/Makefile'
              - 'Makefile.*'
              - '**/Makefile.*'
              - '**/*.mk'
              - 'hack/**'
              - 'scripts/**'
              - '.helmignore'
              - '**/.helmignore'
              - '.github/workflows/helm-chart-ci.yml'
              - '.github/workflows/release-helm-chart.yml'

  helm-checks:
    name: Run repository Helm checks
    needs: changes
    if: needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Set up helm-docs
        uses: gabe565/setup-helm-docs-action@v1
        with:
          version: ${{ env.HELM_DOCS_VERSION }}

      # Helm 4 verifies plugins by default, while this plugin does not publish
      # provenance metadata. The version remains explicit and reproducible.
      - name: Install values schema generator
        run: >-
          helm plugin install
          https://github.com/losisin/helm-values-schema-json.git
          --version "v${HELM_SCHEMA_VERSION}"
          --verify=false

      # Keep this exact command runnable from a local checkout. Generated README
      # and schema drift, basic linting, and template rendering belong here.
      - name: Run local Helm CI contract
        run: make verify-helm-chart

  helm-chart-ci-required:
    name: Helm Chart CI required
    if: always()
    needs:
      - changes
      - helm-checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful Helm CI
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          HELM_RELEVANT: ${{ needs.changes.outputs.helm }}
          HELM_CHECKS_RESULT: ${{ needs.helm-checks.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Helm change detection failed: $CHANGES_RESULT"
            exit 1
          fi

          case "$HELM_RELEVANT" in
            false)
              echo "No Helm-relevant changes."
              exit 0
              ;;
            true) ;;
            *)
              echo "Helm change detection returned an invalid decision: $HELM_RELEVANT"
              exit 1
              ;;
          esac

          if [[ "$HELM_CHECKS_RESULT" != "success" ]]; then
            echo "Helm checks did not complete successfully: $HELM_CHECKS_RESULT"
            exit 1
          fi
