# This workflow builds, loads, inspects, and exports one local image. It never
# logs in to a registry or pushes an image. Extend the change filter for every
# file reachable through the selected Dockerfile and build context.
name: Build Image

on:
  pull_request:
    branches: [$default-branch]
  push:
    branches: [$default-branch]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: build-image-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  IMAGE_CONTEXT: .
  DOCKERFILE: Dockerfile
  IMAGE_REF: local/validation:${{ github.sha }}
  IMAGE_PLATFORM: linux/amd64
  IMAGE_SOURCE: ${{ github.server_url }}/${{ github.repository }}
  IMAGE_REVISION: ${{ github.sha }}

jobs:
  changes:
    name: Detect image changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ github.event_name != 'pull_request' || steps.filter.outputs.image == 'true' }}
    steps:
      - name: Filter changed files
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            image:
              # A generic context of "." can consume any tracked file. Narrow
              # this only after enumerating every Dockerfile COPY/ADD input.
              - '**'

  build:
    name: Build image
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and load without publishing
        run: make build-image

      - name: Inspect loaded image metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE_REF")" = "$IMAGE_PLATFORM"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' "$IMAGE_REF")" = \
            "$IMAGE_SOURCE"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE_REF")" = \
            "$IMAGE_REVISION"

      - name: Create and validate image artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/image"
          rm -rf "$artifact_dir"
          mkdir -p "$artifact_dir"
          docker save --output "$artifact_dir/image.tar" "$IMAGE_REF"
          test -s "$artifact_dir/image.tar"
          tar -tf "$artifact_dir/image.tar" | grep -Fx manifest.json >/dev/null
          (
            cd "$artifact_dir"
            sha256sum image.tar > image.tar.sha256
            sha256sum --check image.tar.sha256
          )

      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: image-validation-${{ github.sha }}
          path: ${{ runner.temp }}/image/
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  image-build-required:
    name: Image Build required
    if: always()
    needs:
      - changes
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful image build
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          IMAGE_RELEVANT: ${{ needs.changes.outputs.image }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Image change detection failed: $CHANGES_RESULT"
            exit 1
          fi

          case "$IMAGE_RELEVANT" in
            false)
              echo "No image-relevant changes."
              exit 0
              ;;
            true) ;;
            *)
              echo "Image change detection returned an invalid decision: $IMAGE_RELEVANT"
              exit 1
              ;;
          esac

          if [[ "$BUILD_RESULT" != "success" ]]; then
            echo "Image build did not complete successfully: $BUILD_RESULT"
            exit 1
          fi
